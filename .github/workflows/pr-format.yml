name: Pull request format

# Runs on every pull request, and again when its title or description is edited.
# The format is in knowledge/decisions/issue-workflow.md, and its sections come
# from .github/pull_request_template.md. The check comes from the agent kit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Pull request format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: Tukutupap/agent-kit/checks/pr-format@v1
        with:
          title: ${{ github.event.pull_request.title }}
          body: ${{ github.event.pull_request.body }}
          author: ${{ github.event.pull_request.user.login }}
